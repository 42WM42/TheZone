<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>View Post - The Zone</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; max-width: 800px; margin: 50px auto; padding: 20px; }
        .post-card { background: #1e1e1e; border-radius: 8px; padding: 25px; position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .post-content { line-height: 1.6; font-size: 1.1em; margin-bottom: 20px; white-space: pre-wrap; }
        .post-card img { max-width: 100%; border-radius: 5px; display: block; margin: 0 auto; }
        .date { font-size: 0.9em; color: #888; margin-top: 20px; border-top: 1px solid #333; padding-top: 15px; }
        .back-link { color: #7c4dff; text-decoration: none; display: inline-block; margin-bottom: 20px; font-weight: bold; }
        .back-link:hover { text-decoration: underline; }
        
        /* 3 Dots Menu CSS */
        .menu-container { position: absolute; top: 20px; right: 20px; }
        .three-dots { background: none; border: none; color: white; font-size: 24px; cursor: pointer; padding: 0 10px; }
        .dropdown-content { display: none; position: absolute; right: 0; background-color: #2a2a2a; min-width: 120px; box-shadow: 0px 8px 16px rgba(0,0,0,0.5); border-radius: 5px; z-index: 1; overflow: hidden; }
        .dropdown-content a, .dropdown-content button { color: white; padding: 12px 16px; text-decoration: none; display: block; width: 100%; text-align: left; background: none; border: none; font-size: 1em; cursor: pointer; font-family: inherit; }
        .dropdown-content a:hover, .dropdown-content button:hover { background-color: #333; }
        .dropdown-content button { color: #ff5252; } /* Make delete text red */
        .show { display: block; }
    </style>
</head>
<body>
    <a href="/" class="back-link">← Back to Feed</a>

    <div class="post-card">
        <!-- 3 Dots Menu -->
        <div class="menu-container">
            <button class="three-dots" onclick="toggleMenu()">⋮</button>
            <div id="dropdown" class="dropdown-content">
                <a th:href="@{/post/{id}/edit(id=${post.id})}">Edit</a>
                <form th:action="@{/post/{id}/delete(id=${post.id})}" method="post" onsubmit="return confirm('Are you sure you want to delete this post?');">
                    <button type="submit">Delete</button>
                </form>
            </div>
        </div>

        <!-- Post Content -->
        <div class="post-content" th:text="${post.content}"></div>
        <img th:if="${post.imageUrl != null and !post.imageUrl.isEmpty()}" th:src="${post.imageUrl}" alt="Game Image">
        <div class="date" th:text="${#temporals.format(post.createdAt, 'MMM dd, yyyy HH:mm')}"></div>
    </div>

    <script>
        // Toggle the dropdown menu
        function toggleMenu() {
            document.getElementById("dropdown").classList.toggle("show");
        }

        // Close the dropdown if the user clicks anywhere else on the screen
        window.onclick = function(event) {
            if (!event.target.matches('.three-dots')) {
                var dropdowns = document.getElementsByClassName("dropdown-content");
                for (var i = 0; i < dropdowns.length; i++) {
                    var openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }
    </script>
</body>
</html>
