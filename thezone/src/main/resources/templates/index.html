<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>The Zone</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .btn { background: #6200ea; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .btn:hover { background: #7c4dff; }
        
        /* 3-Column Masonry Layout */
        .post-container {
            column-count: 3;
            column-gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .post-card {
            background: #1e1e1e;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            break-inside: avoid; /* Prevents posts from being split across columns */
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .post-card p { margin-top: 0; line-height: 1.5; }
        .post-card img { max-width: 100%; border-radius: 5px; margin-top: 15px; display: block; }
        .date { font-size: 0.8em; color: #888; margin-top: 10px; text-align: right; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Welcome to The Zone</h1>
        <a href="/make-post" class="btn">Make Post</a>
    </div>

    <div class="post-container">
        <div class="post-card" th:each="post : ${posts}">
            <p th:text="${post.content}"></p>
            <!-- Only show image if one was selected -->
            <img th:if="${post.imageUrl != null and !post.imageUrl.isEmpty()}" th:src="${post.imageUrl}" alt="Game Image">
            <div class="date" th:text="${#temporals.format(post.createdAt, 'MMM dd, yyyy HH:mm')}"></div>
        </div>
    </div>
</body>
</html>
