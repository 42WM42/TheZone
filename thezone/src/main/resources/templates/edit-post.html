<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Post - The Zone</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; max-width: 600px; margin: 50px auto; padding: 20px; }
        .form-container { background: #1e1e1e; padding: 20px; border-radius: 8px; }
        textarea { width: 100%; height: 150px; background: #2a2a2a; color: white; border: 1px solid #444; padding: 10px; border-radius: 5px; box-sizing: border-box; margin-bottom: 15px; resize: vertical; }
        .btn { background: #6200ea; color: white; padding: 10px 20px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; }
        .btn:hover { background: #7c4dff; }
        a { color: #bbb; text-decoration: none; display: block; text-align: center; margin-top: 15px; }
        .current-image { max-width: 100px; border-radius: 5px; margin-bottom: 15px; display: block; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Edit Post</h2>
        <!-- Form submits to the edit URL -->
        <form th:action="@{/post/{id}/edit(id=${post.id})}" th:object="${post}" method="post" enctype="multipart/form-data">
            
            <label for="content">Edit your message:</label>
            <textarea id="content" th:field="*{content}" required></textarea>
            
            <label for="image">Replace Image (Leave blank to keep current):</label>
            
            <!-- Shows a tiny preview of the current image if one exists -->
            <img th:if="${post.imageUrl != null and !post.imageUrl.isEmpty()}" th:src="${post.imageUrl}" class="current-image" alt="Current Image">
            
            <input type="file" id="image" name="imageFile" accept="image/*" style="width: 100%; padding: 10px; background: #2a2a2a; color: white; border: 1px solid #444; border-radius: 5px; margin-bottom: 20px; box-sizing: border-box;">
            
            <button type="submit" class="btn">Save Changes</button>
        </form>
        <a th:href="@{/post/{id}(id=${post.id})}">Cancel</a>
    </div>
</body>
</html>
