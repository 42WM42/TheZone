<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Make a Post - The Zone</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; max-width: 600px; margin: 50px auto; padding: 20px; }
        .form-container { background: #1e1e1e; padding: 20px; border-radius: 8px; }
        textarea { width: 100%; height: 150px; background: #2a2a2a; color: white; border: 1px solid #444; padding: 10px; border-radius: 5px; box-sizing: border-box; margin-bottom: 15px; resize: vertical; }
        select { width: 100%; padding: 10px; background: #2a2a2a; color: white; border: 1px solid #444; border-radius: 5px; margin-bottom: 20px; }
        .btn { background: #6200ea; color: white; padding: 10px 20px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; }
        .btn:hover { background: #7c4dff; }
        a { color: #bbb; text-decoration: none; display: block; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Create a New Post</h2>
        <form th:action="@{/post}" th:object="${newPost}" method="post">
            <label for="content">What's on your mind?</label>
            <textarea id="content" th:field="*{content}" placeholder="Type your post here..." required></textarea>
            
            <label for="image">Attach an Image (Optional):</label>
            <select id="image" th:field="*{imageUrl}">
                <option value="">-- No Image --</option>
                <option value="https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=500&q=60">Controller / Console</option>
                <option value="https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=500&q=60">Retro Gaming</option>
                <option value="https://images.unsplash.com/photo-1538481199705-c710c4e965fc?auto=format&fit=crop&w=500&q=60">PC Setup</option>
            </select>
            
            <button type="submit" class="btn">Post to The Zone</button>
        </form>
        <a href="/">Cancel</a>
    </div>
</body>
</html>
