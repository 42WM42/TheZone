<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>The Zone - Feed</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; max-width: 800px; margin: 50px auto; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; padding-bottom: 20px; margin-bottom: 30px; }
        .header h1 { margin: 0; color: #7c4dff; text-decoration: none;}
        .header a.logo { text-decoration: none; color: inherit; }
        .btn { background: #6200ea; color: white; padding: 10px 15px; border: none; border-radius: 5px; text-decoration: none; font-weight: bold; cursor: pointer; display: inline-block; }
        .btn:hover { background: #7c4dff; }
        .btn-secondary { background: #333; }
        .btn-secondary:hover { background: #444; }
        .post-card { background: #1e1e1e; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); text-decoration: none; display: block; color: inherit; transition: transform 0.2s; }
        .post-card:hover { transform: translateY(-3px); border: 1px solid #333;}
        
        /* Updated Image CSS */
        .post-card img { max-width: 100%; max-height: 400px; height: auto; object-fit: contain; border-radius: 5px; margin: 15px auto 0 auto; display: block; }
        
        .post-meta { font-size: 0.9em; color: #888; margin-top: 15px; display: flex; justify-content: space-between; }
        .admin-panel { background: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 30px; border-left: 4px solid #ff5252; }
        .admin-panel h3 { margin-top: 0; color: #ff5252; }
        .user-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #444; }
    </style>
</head>
<body>

    <div class="header">
        <a href="/" class="logo"><h1>The Zone</h1></a>
        
        <!-- Logged In Controls -->
        <div th:if="${currentUserEmail != null}">
            <span style="margin-right: 15px; font-weight: bold; color: #03dac6;">@<span th:text="${currentUsername}"></span></span>
            <a th:href="@{/make-post}" class="btn">New Post</a>
            <a th:href="@{/settings}" class="btn btn-secondary">Settings</a>
            <form th:action="@{/logout}" method="post" style="display:inline; margin-left: 5px;">
                <button type="submit" class="btn btn-secondary">Logout</button>
            </form>
        </div>
        
        <!-- Logged Out Controls -->
        <div th:if="${currentUserEmail == null}">
            <a th:href="@{/login}" class="btn" style="background: #333; margin-right: 5px;">Log in to post</a>
            <a th:href="@{/login}" class="btn btn-secondary">Login</a>
            <a th:href="@{/register}" class="btn btn-secondary">Register</a>
        </div>
    </div>

    <!-- Admin Panel -->
    <div th:if="${isAdmin}" class="admin-panel">
        <h3>Admin Dashboard (Manage Users)</h3>
        <div th:each="user : ${users}" class="user-row">
            <span th:text="${user.username} + ' (' +${user.email} + ')'"></span>
            <span>
                <span th:if="${user.banned}" style="color: #ff5252; font-weight: bold; margin-right: 10px;">BANNED</span>
                <form th:if="${user.role != 'ROLE_ADMIN'}" th:action="@{/admin/ban}" method="post" style="display:inline;">
                    <input type="hidden" name="email" th:value="${user.email}" />
                    <button type="submit" class="btn" style="padding: 5px 10px; background: #ff5252;" th:text="${user.banned ? 'Unban' : 'Ban'}"></button>
                </form>
            </span>
        </div>
    </div>

    <!-- Feed -->
    <h2>Recent Posts</h2>
    <div th:if="${#lists.isEmpty(posts)}">
        <p style="color:#aaa;">No posts yet.</p>
    </div>
    
    <a th:each="post : ${posts}" th:href="@{/post/{id}(id=${post.id})}" class="post-card">
        <div style="font-size: 1.1em; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word;" th:text="${post.content}"></div>
        <img th:if="${post.imageUrl != null and !post.imageUrl.isEmpty()}" th:src="${post.imageUrl}">
        <div class="post-meta">
            <span style="color: #03dac6; font-weight: bold;" th:text="'@' + ${post.authorUsername}"></span>
            <span th:text="${#temporals.format(post.createdAt, 'MMM dd, yyyy HH:mm')}"></span>
        </div>
    </a>

</body>
</html>
